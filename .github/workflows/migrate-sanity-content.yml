# One-off content migration, runnable from a phone.
#
# scripts/export-sanity.ts has to run somewhere that can reach sanity.io and can
# write back to the repository. A GitHub runner can do both, and this workflow can
# be started from the GitHub web UI on a phone - no laptop, no terminal, no
# checkout.
#
# HOW IT RUNS
#
# Automatically, on any push to the migration branch. Nothing to click.
#
# It cannot rely on the "Run workflow" button, because GitHub only shows a
# workflow_dispatch workflow in the Actions UI once its file is on the DEFAULT
# branch. This one lives on a feature branch, so that button never appears -
# which is exactly why the first attempt at this workflow was invisible. A push
# trigger has no such rule: the run happens on the branch the file is on.
#
# workflow_dispatch is kept anyway, so the button works too if this ever lands on
# main.
#
# It commits the exported JSON and the downloaded images straight back to the
# branch. Safe to re-run: the export only ever adds files, and the commit step
# does nothing when there is nothing new. No loop either - GitHub does not start
# workflow runs from pushes made with the default GITHUB_TOKEN.
#
# Delete this workflow, and scripts/export-sanity.ts, once the migration is done.

name: Migrate Sanity content into the repo

on:
  push:
    branches: [claude/safar-trails-website-setup-4vbki3]
  workflow_dispatch:
    inputs:
      project_id:
        description: 'Sanity project ID'
        required: true
        default: 'xmtc060o'
      dataset:
        description: 'Sanity dataset'
        required: true
        default: 'production'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Export everything out of Sanity
        # inputs are empty on a push event, so the defaults are spelled out here
        # rather than left to fall through the script's own fallback.
        env:
          VITE_SANITY_PROJECT_ID: ${{ inputs.project_id || 'xmtc060o' }}
          VITE_SANITY_DATASET: ${{ inputs.dataset || 'production' }}
        run: npx tsx scripts/export-sanity.ts 2>&1 | tee /tmp/export.log

      - name: Check the exported content is valid
        run: npm run content

      - name: Confirm the site still builds with it
        run: npm run build:pages

      - name: Check no live URL is lost
        run: npx tsx scripts/check-urls.ts

      - name: Commit the migrated content
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add content public/content
          if git diff --cached --quiet; then
            echo "NOTHING_NEW=true" >> "$GITHUB_ENV"
            echo "Nothing new to commit - content/ already has everything Sanity holds."
            exit 0
          fi
          git commit -m "Migrate remaining Sanity content into the repo

          Exported by .github/workflows/migrate-sanity-content.yml so the CMS can
          be switched off without losing the pages that only existed there, or the
          images they were serving from cdn.sanity.io.

          Generated, not hand-written - see the workflow run summary for the list
          of fields the export could not fill."
          git push

      - name: Write the summary
        if: always()
        run: |
          {
            echo '## Sanity migration'
            echo
            if [ "${NOTHING_NEW:-false}" = "true" ]; then
              echo 'Nothing new was committed - `content/` already holds everything Sanity has.'
            else
              echo 'Committed to `${{ github.ref_name }}`. New and changed files:'
              echo
              echo '```'
              git show --stat --oneline HEAD | head -60
              echo '```'
            fi
            echo
            echo '### Export report'
            echo
            echo '```'
            cat /tmp/export.log 2>/dev/null || echo 'The export did not produce a log - check the step above for the error.'
            echo '```'
            echo
            echo '### Next'
            echo
            echo '1. Read the "FIELDS THAT NEED WRITING" list above - those pages will be thin until someone fills them in.'
            echo '2. Compare the generated sitemap against `content/.sitemap-baseline.txt`. Every live URL must still be there.'
            echo '3. Then the pull request is safe to merge.'
          } >> "$GITHUB_STEP_SUMMARY"
