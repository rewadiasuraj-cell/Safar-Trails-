<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <!-- Google Analytics 4 (gtag.js) is bootstrapped from src/lib/analytics.ts so the
         measurement ID can come from an env var reliably, with per-route page_view
         events fired on every React Router navigation. -->
    <!-- The tags below are the HOMEPAGE defaults. scripts/prerender.ts rewrites
         them per route at build time, and src/lib/seo/Seo.tsx keeps them correct
         across client-side navigation. Edit the copy in src/lib/seo/routes.ts. -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>Custom India Tour Packages – AI Trip Planner | Safar Trails</title>
    <meta name="description" content="Custom Kashmir, Kerala, Himachal &amp; Rajasthan tour packages, planned by AI and refined by real travel experts. 24x7 support, transparent pricing. Get a free itinerary!" />
    <meta name="keywords" content="India holiday packages, AI trip planner India, custom travel itineraries, Kashmir tour packages, Kerala houseboat tour, Rajasthan tour packages, Himachal holiday packages, Goa honeymoon package, trusted travel agency India, Safar Trails" />
    <meta name="author" content="Safar Trails" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="https://safartrails.co.in/" />

    <!-- Open Graph / Facebook / WhatsApp Social Media Card -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Safar Trails" />
    <meta property="og:url" content="https://safartrails.co.in/" />
    <meta property="og:title" content="Safar Trails – Travel with Trust" />
    <meta property="og:description" content="Custom tour packages across India &amp; abroad. Hand-planned itineraries, verified stays, transparent pricing and 24x7 on-trip support." />
    <meta property="og:image" content="https://safartrails.co.in/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:alt" content="Safar Trails – Travel with Trust" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@SafarTrails" />
    <meta name="twitter:title" content="Safar Trails – Travel with Trust" />
    <meta name="twitter:description" content="Custom tour packages across India &amp; abroad. Hand-planned itineraries, verified stays and 24x7 on-trip support." />
    <meta name="twitter:image" content="https://safartrails.co.in/og-image.jpg" />
    <meta name="twitter:image:alt" content="Safar Trails – Travel with Trust" />

    <meta name="theme-color" content="#1B2456" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Preconnect & DNS-Prefetch for Fast Third-Party Network Connections -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    <link rel="dns-prefetch" href="https://fonts.gstatic.com">
    <link rel="preconnect" href="https://images.unsplash.com">
    <link rel="dns-prefetch" href="https://images.unsplash.com">

    <!-- Non-Blocking Google Fonts Loading (Prevents Render-Blocking on Mobile) -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400;1,600&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400;1,600&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400;1,600&display=swap"
      />
    </noscript>

    <!-- Site-wide organization graph. scripts/prerender.ts replaces this with the
         per-route @graph (TouristTrip / TouristDestination / Article / FAQPage /
         BreadcrumbList) built in src/lib/seo/structuredData.ts. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "TravelAgency",
          "@id": "https://safartrails.co.in/#organization",
          "name": "Safar Trails",
          "alternateName": "SafarTrails",
          "slogan": "Travel with Trust",
          "url": "https://safartrails.co.in",
          "logo": "https://safartrails.co.in/logo.svg",
          "image": "https://safartrails.co.in/og-image.jpg",
          "description": "Indian travel agency crafting custom tour packages across India and abroad \u2014 hand-planned itineraries, verified stays, transparent pricing and 24x7 on-trip support.",
          "telephone": "+918076665782",
          "email": "info.safartrails@gmail.com",
          "priceRange": "\u20b9\u20b9 - \u20b9\u20b9\u20b9\u20b9",
          "address": {
            "@type": "PostalAddress",
            "streetAddress": "Pillar No. 786, Plot No. 2, Jai Bharat Enclave, Bhagwati Garden, Nawada",
            "addressLocality": "New Delhi",
            "addressRegion": "Delhi",
            "postalCode": "110059",
            "addressCountry": "IN"
          },
          "geo": { "@type": "GeoCoordinates", "latitude": 28.6139, "longitude": 77.0421 },
          "areaServed": { "@type": "Country", "name": "India" },
          "sameAs": [
            "https://www.facebook.com/safartrails/",
            "https://www.instagram.com/safartrails.in/"
          ]
        },
        {
          "@type": "WebSite",
          "@id": "https://safartrails.co.in/#website",
          "url": "https://safartrails.co.in",
          "name": "Safar Trails \u2014 Holiday Packages & AI Trip Planner",
          "publisher": { "@id": "https://safartrails.co.in/#organization" },
          "potentialAction": {
            "@type": "SearchAction",
            "target": {
              "@type": "EntryPoint",
              "urlTemplate": "https://safartrails.co.in/?search={search_term_string}"
            },
            "query-input": "required name=search_term_string"
          }
        }
      ]
    }
    </script>
  </head>
  <body class="bg-[#FBFBFA] text-[#1E293B] antialiased selection:bg-[#C2410C]/20 selection:text-[#0B2545]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
