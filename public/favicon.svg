<svg viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Teal Gradient for Pin Loop & Road -->
    <linearGradient id="tealGrad" x1="100" y1="40" x2="350" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#147B8C" />
      <stop offset="50%" stop-color="#0E5E6D" />
      <stop offset="100%" stop-color="#093C46" />
    </linearGradient>

    <!-- Deep Teal for Perspective Road -->
    <linearGradient id="roadGrad" x1="120" y1="260" x2="320" y2="460" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0E5E6D" />
      <stop offset="40%" stop-color="#0A4652" />
      <stop offset="100%" stop-color="#062D35" />
    </linearGradient>

    <!-- Warm Gold / Ochre Accent Swoosh -->
    <linearGradient id="goldGrad" x1="280" y1="360" x2="390" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A97534" />
      <stop offset="50%" stop-color="#CD9B52" />
      <stop offset="100%" stop-color="#DFAD62" />
    </linearGradient>

    <!-- Gold Left-Trim Accent -->
    <linearGradient id="goldLeftTrim" x1="100" y1="280" x2="130" y2="330" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#DFAD62" />
      <stop offset="100%" stop-color="#CD9B52" />
    </linearGradient>
  </defs>

  <!-- Background is transparent for true favicon versatility -->

  <!-- Left Gold Trim Edge along the Road -->
  <path
    d="M102 300 C110 278 122 258 138 240 L146 250 C132 268 120 286 114 308 Z"
    fill="url(#goldLeftTrim)"
  />

  <!-- Outer Main Teal Pin Arc / Loop -->
  <path
    d="M236 448
       L104 316
       C62 274 48 214 68 156
       C88 98 140 56 202 46
       C266 36 328 62 366 112
       C334 84 286 68 238 74
       C180 82 132 120 114 174
       C96 226 108 280 144 320
       Z"
    fill="url(#tealGrad)"
  />

  <!-- Perspective Highway / Road curving up from pin point toward the plane -->
  <path
    d="M236 448
       L112 324
       C150 250 210 190 326 156
       C262 198 212 258 184 340
       L236 448
       Z"
    fill="url(#roadGrad)"
  />

  <!-- Right Gold Accent Swoosh (completes the pin contour on the right) -->
  <path
    d="M236 448
       L294 366
       C346 294 380 236 384 200
       C384 208 376 254 332 326
       L236 448
       Z"
    fill="url(#goldGrad)"
  />

  <!-- Road White Dashed Center Markings (Perspective dash marks tapering toward the plane) -->
  <!-- Dash 1: Bottom large -->
  <path
    d="M168 370 L174 346 L182 348 L175 373 Z"
    fill="#FFFFFF"
  />
  <!-- Dash 2 -->
  <path
    d="M182 334 L190 308 L197 310 L188 337 Z"
    fill="#FFFFFF"
  />
  <!-- Dash 3 -->
  <path
    d="M200 296 L210 270 L216 272 L206 298 Z"
    fill="#FFFFFF"
  />
  <!-- Dash 4 -->
  <path
    d="M222 258 L234 234 L239 236 L227 260 Z"
    fill="#FFFFFF"
  />
  <!-- Dash 5 -->
  <path
    d="M246 224 L260 200 L264 202 L250 226 Z"
    fill="#FFFFFF"
  />
  <!-- Dash 6: Near jet contrail trail -->
  <path
    d="M272 190 L290 170 L294 172 L275 192 Z"
    fill="#FFFFFF"
    opacity="0.9"
  />
  <!-- Jet Contrail streak linking road directly to airplane tail -->
  <path
    d="M304 158 L330 142 L332 144 L306 160 Z"
    fill="#FFFFFF"
    opacity="0.8"
  />

  <!-- Airplane Silhouette (Teal, angled up-right into the sky) -->
  <g transform="translate(370, 126) rotate(-28) scale(1.15)">
    <!-- Fuselage -->
    <path
      d="M0 -38
         C3 -38 7 -32 7 -20
         L7 16
         C7 26 5 34 0 38
         C-5 34 -7 26 -7 16
         L-7 -20
         C-7 -32 -3 -38 0 -38
         Z"
      fill="#0B4D5B"
    />
    <!-- Main Swept Wings -->
    <path
      d="M0 -10
         L38 12
         C40 14 38 17 34 17
         L8 6
         L8 18
         L-8 18
         L-8 6
         L-34 17
         C-38 17 -40 14 -38 12
         L0 -10
         Z"
      fill="#0E5E6D"
    />
    <!-- Tail Wing Stabilizers -->
    <path
      d="M0 24
         L17 35
         C18 36 17 38 15 38
         L3 34
         L-3 34
         L-15 38
         C-17 38 -18 36 -17 35
         L0 24
         Z"
      fill="#0B4D5B"
    />
    <!-- Vertical Tail Fin -->
    <path
      d="M0 16
         L0 36
         L-2 36
         L-2 18
         Z"
      fill="#083842"
    />
  </g>
</svg>
